<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280">
  <rect x="0.5" y="0.5" width="599" height="279" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 10 a 10 10 0 0 1 10 -10 h 579 a 10 10 0 0 1 10 10 v 30 h -599 z" fill="#161b22"/>
  <circle cx="20" cy="15" r="5" fill="#2d2d2d"/>
  <circle cx="38" cy="15" r="5" fill="#2d2d2d"/>
  <circle cx="56" cy="15" r="5" fill="#2d2d2d"/>
  <text x="300" y="20" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" fill="#8b949e">giti@bedrock ~ %</text>

  <g font-family="JetBrains Mono,monospace" font-size="13">
    <text x="20" y="70" fill="#00ffaa">$</text>
    <text x="35" y="70" fill="#c9d1d9">whoami</text>
    <text x="20" y="100" fill="#8b949e">giti_adrescor</text>

    <text x="20" y="135" fill="#00ffaa">$</text>
    <text x="35" y="135" fill="#c9d1d9">cat system.info</text>
    <text x="20" y="160" fill="#8b949e">os:      Bedrock Linux (Artix + Devuan)</text>
    <text x="20" y="180" fill="#8b949e">init:    runit / sysvinit</text>
    <text x="20" y="200" fill="#8b949e">langs:   C · Rust · Python · JS/TS · HTML/CSS</text>

    <text x="20" y="235" fill="#00ffaa">$</text>
    <text x="35" y="235" fill="#c9d1d9">echo $PROJECT</text>
    <text x="20" y="260" fill="#00ffaa">G OS</text>
  </g>

  <rect x="55" y="248" width="8" height="14" fill="#c9d1d9">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>

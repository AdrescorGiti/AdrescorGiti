<svg xmlns="http://www.w3.org/2000/svg" width="700" height="80" viewBox="0 0 700 80">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffaa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffaa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00ffaa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="700" height="80" fill="none"/>
  <rect x="0" y="40" width="700" height="1" fill="url(#fg)"/>
  <text x="350" y="30" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="12" fill="#505050" letter-spacing="2">
    [ OK ] System ready. Thanks for visiting...
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </text>
  <text x="350" y="60" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="#30363d" letter-spacing="3">
    © 2025 GITI ADRESCOR
    <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <circle cx="50" cy="40" r="3" fill="#00ffaa">
    <animate attributeName="cx" values="50;650;50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>

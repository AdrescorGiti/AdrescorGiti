        ▸ WHO AM I ◂
        <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="55" y="14" font-family="JetBrains Mono,monospace" font-size="10" fill="#30363d">01</text>
